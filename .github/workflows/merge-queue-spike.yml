# S4.4.6 spike 1 and 3 (docs/s4-4-6-plan.md): what does a workflow see on `merge_group`, and does a failing required check eject the entry?
# Observation only: GitHub-hosted runner, no secrets, no repository code is executed. Prints explicit, non-secret fields and the DECODED claims of the OIDC token (never the token).
# Job `observe` always passes. Job `gate` is the one to make required: on `merge_group` it FAILS when the merged tree contains the file spike/FAIL (spike 3), on a pull request it passes.
name: merge-queue-spike
on:
  merge_group:
  pull_request:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: fields the runner sees
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          MQ: ${{ toJSON(github.event.merge_group) }}
        run: |
          set -u
          for v in EVENT REF REF_NAME SHA BASE_REF HEAD_REF REPO REPO_ID OWNER_ID WORKFLOW_REF RUN_ID; do printf '%-14s %s\n' "$v" "${!v}"; done
          echo "--- event.merge_group (null on a pull_request run):"; printf '%s\n' "$MQ"
      - name: queue branch name -> pull request number (the Q-2 lookup)
        if: github.event_name == 'merge_group'
        env: { HEAD_REF_MQ: "${{ github.event.merge_group.head_ref }}" }
        run: |
          echo "head_ref: $HEAD_REF_MQ"
          if [[ "$HEAD_REF_MQ" =~ ^refs/heads/gh-readonly-queue/([^/]+)/pr-([0-9]+)-([0-9a-f]{40})$ ]]; then
            echo "parsed: base=${BASH_REMATCH[1]} pr=${BASH_REMATCH[2]} sha=${BASH_REMATCH[3]}"
          else echo "NOT PARSED by the contract's pattern"; fi
      - name: the merged tree against its base (what Q-3 and Q-4 would hash)
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          git log --oneline -5 "$HEAD_SHA" || true
          echo "head tree: $(git rev-parse "$HEAD_SHA^{tree}")   base tree: $(git rev-parse "$BASE_SHA^{tree}")   checked-out sha equals head_sha: $([ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] && echo yes || echo no)"
          echo "parents of head: $(git rev-list --parents -n1 "$HEAD_SHA")"
          git diff --stat "$BASE_SHA" "$HEAD_SHA" | tail -8
      - name: OIDC claims (decoded; the token itself is never printed)
        run: |
          set -eu
          tok="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=autonomix-spike" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          TOK="$tok" python3 - <<'PY'
          import os,json,base64
          p=os.environ["TOK"].split(".")[1]; p+="="*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          for k in ("iss","aud","sub","event_name","ref","ref_type","sha","repository","repository_id","repository_owner_id","job_workflow_ref","job_workflow_sha","workflow_ref","runner_environment","run_id","run_attempt"):
              print(f"{k:22} {c.get(k)}")
          PY
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: fail on the merge queue when the merged tree holds spike/FAIL (spike 3); always pass on a pull request
        env: { EVENT: "${{ github.event_name }}" }
        run: |
          if [ "$EVENT" = merge_group ] && [ -e spike/FAIL ]; then echo "gate: spike/FAIL is in the merged tree: failing on purpose"; exit 1; fi
          echo "gate: passing (event $EVENT)"
