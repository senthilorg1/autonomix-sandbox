# S4 spike 2, real-token test. Copy to .github/workflows/oidc-claims.yml in senthilorg1/autonomix-sandbox (a throwaway public repository: workflow logs are public, and carry no secret).
# Run it (a) from main, (b) from a branch, (c) from a pull request, using "Run workflow" and by opening a PR; copy the printed claims here (the claims are not secrets).
name: oidc-claims
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - name: Print the claims (direct job)
        env:
          AUD: https://senthilorg1.example/openbao
        run: |
          set -eu
          T="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$T"
          printf '%s' "$T" | python3 -c '
          import sys,json,base64
          p=sys.stdin.read().split(".")[1]; p+="="*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          keep=["iss","aud","sub","repository","repository_id","repository_owner","repository_visibility","ref","ref_type","ref_protected","sha","event_name","workflow","workflow_ref","workflow_sha","job_workflow_ref","job_workflow_sha","environment","runner_environment","actor","head_ref","base_ref"]
          print(json.dumps({k:c.get(k) for k in keep if k in c},indent=2,sort_keys=True))
          print("claim names present:", sorted(c.keys()))'
  via-reusable:
    uses: ./.github/workflows/oidc-claims-reusable.yml
