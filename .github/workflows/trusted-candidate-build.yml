# Forgery case A-8(a): a pull request whose caller stub does not call the reusable workflow. Expected: no candidate, no provenance, the recorder records no approval.
name: trusted-candidate-build
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  candidate:
    runs-on: arc-untrusted
    steps:
      - run: echo "a stub that builds nothing and signs nothing"
