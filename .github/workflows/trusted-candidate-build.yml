# Caller stub of the Stage 3 candidate build (contract 16 section 4, requirement W-1). The file name is what the approval recorder watches.
# It only calls the reusable workflow on main by absolute reference: the called jobs run the version on main, never the pull request's copy (spike 1).
# A pull request may edit this stub (it is CODEOWNERS-protected, so the change cannot merge), but an edited or missing stub yields no signed candidate.
# The head SHA is NOT an input: the reusable workflow reads it from the event. The service name is the only input.
name: trusted-candidate-build
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  candidate:
    # the caller grants the ceiling; the reusable workflow narrows it per job (the build job gets no id-token)
    permissions:
      contents: read
      id-token: write
    uses: senthilorg1/autonomix-sandbox/.github/workflows/trusted-candidate-build-reusable.yml@main
    with:
      service: demo-svc
