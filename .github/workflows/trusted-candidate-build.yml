# Forgery case A-8(b): a pull request that calls its OWN copy of the reusable workflow by relative path (the copy is in this pull request's tree).
# Expected: job_workflow_ref is .../trusted-candidate-build-reusable.yml@refs/pull/<n>/merge, so the broker answers 403 at mint and the run is red; no robot, no signature.
name: trusted-candidate-build
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  candidate:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/trusted-candidate-build-reusable.yml
    with:
      service: demo-svc
